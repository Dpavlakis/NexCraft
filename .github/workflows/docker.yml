name: Publish Docker images (GHCR)

# Publishes the NexCraft web + daemon images to GitHub Container Registry so the
# Unraid Community Applications templates can pull them:
#   ghcr.io/dpavlakis/nexcraft-web:latest
#   ghcr.io/dpavlakis/nexcraft-daemon:latest
# Triggers on a published Release, a v* tag, or a manual run.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

# Opt the bundled JS actions (checkout, buildx, metadata, login, build-push) into
# Node 24 — GitHub deprecated Node 20 on the runners (forced switch ~2026-06-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (web)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/web.dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDPLATFORM=linux/amd64

  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (daemon)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-daemon
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/daemon.dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDPLATFORM=linux/amd64
            EMBEDDED_JAVA_VERSION=21
